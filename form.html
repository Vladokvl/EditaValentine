<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Date</title>
    <link rel="stylesheet" href="css/date.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Delius+Swash+Caps&display=swap" rel="stylesheet">
</head>
<body>
    <h1 title="choose a date">Are you free on ...</h1>
    
    <form id="dateForm" class="form-group">
        <label>Which day: (select a date)</label>
        <div>
            <input type="date" name="date" required />
        </div>

        <div class="question-title">
            <b>What food would you like to eat?</b>
        </div>
        <div class="selection-grid">
            <div class="choice-item">
                <input type="checkbox" id="pizza" name="food" value="pizza" />
                <label for="pizza">
                    <img src="food/pizza.jpg" alt="pizza" />
                    <span>Pizza</span>
                </label>
            </div>
            <div class="choice-item">
                <input type="checkbox" id="hachapuri" name="food" value="hachapuri" />
                <label for="hachapuri">
                    <img src="food/hachapuri.jpg" alt="hachapuri" />
                    <span>Hachapuri</span>
                </label>
            </div>
            <div class="choice-item">
                <input type="checkbox" id="sushi" name="food" value="sushi" />
                <label for="sushi">
                    <img src="food/sushi.jpg" alt="sushi" />
                    <span>Sushi</span>
                </label>
            </div>
            <div class="choice-item">
                <input type="checkbox" id="kfc" name="food" value="KFC" />
                <label for="kfc">
                    <img src="food/kfc.jpg" alt="kfc" />
                    <span>KFC</span>
                </label>
            </div>
            <div class="choice-item">
                <input type="checkbox" id="dumplings" name="food" value="dumplings" />
                <label for="dumplings">
                    <img src="food/pelmeni.jpg" alt="pelmeni" />
                    <span>Dumplings</span>
                </label>
            </div>
        </div>

        <div class="question-title"><b>What are we doing?</b></div>
        <div class="selection-grid">
            <div class="choice-item">
                <input type="checkbox" id="ski" name="activities" value="ski" />
                <label for="ski">
                    <img src="activities/ski.jpg" alt="ski" />
                    <span>Ski</span>
                </label>
            </div>
            <div class="choice-item">
                <input type="checkbox" id="cinema" name="activities" value="cinema" />
                <label for="cinema">
                    <img src="activities/cinema.jpeg" alt="cinema" />
                    <span>Cinema</span>
                </label>
            </div>
            <div class="choice-item">
                <input type="checkbox" id="racingclub" name="activities" value="racingclub" />
                <label for="racingclub">
                    <img src="activities/racingclub.jpg" alt="racingclub" />
                    <span>Racingclub</span>
                </label>
            </div>
            <div class="choice-item">
                <input type="checkbox" id="park" name="activities" value="park" />
                <label for="park">
                    <img src="activities/Park.jpg" alt="park" />
                    <span>Park</span>
                </label>
            </div>
        </div>

        <label>Leave a message (optional):</label>
        <textarea name="message" placeholder="Your message..."></textarea>

        <button class="button" type="submit">Send</button>
    </form>

    <h1 id="thankYouMessage" style="display: none;">See you soon!</h1>
    <div id="loadingMessage" style="display: none;">  
        Sending your choices... ❤️  
    </div>

    <script>
        document.getElementById('dateForm').addEventListener('submit', function(event) {  
            event.preventDefault();  
            
            const formData = new FormData(this);  
            const form = document.getElementById('dateForm');  
            
            if (document.getElementById('loadingMessage')) {  
                document.getElementById('loadingMessage').style.display = 'block';  
            }  
            form.style.opacity = '0.5';  
        
            fetch('https://formspree.io/f/mvgzryoa', {  
                method: 'POST',  
                body: formData,  
                headers: {  
                    'Accept': 'application/json'  
                }  
            })  
            .then(response => {  
                if (!response.ok) {  
                    throw new Error('Network response was not ok');  
                }  
                window.location.href = 'success.html';  
            })  
            .catch(error => {  
                console.error('Error:', error);  
                form.style.opacity = '1';  
                if (document.getElementById('loadingMessage')) {  
                    document.getElementById('loadingMessage').style.display = 'none';  
                }  
                alert('Something went wrong! Please try again.');  
            });  
        });
    </script>
</body>
</html>
